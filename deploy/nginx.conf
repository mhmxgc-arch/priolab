# Baked into the image, not bind-mounted: a single-file bind mount keeps the old
# inode after `git merge`, so an edit here would never reach a running container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The page handles financial reports, so it is locked to its own origin:
    # no third-party script, and no connection anywhere -- an uploaded file has
    # no way out of the browser even if a dependency misbehaved. Inline styles
    # are allowed because index.html and app.js use them; inline script is not.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        # Always revalidate, so a deploy is visible on the next page load.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.js$ {
        # app.js keeps its name across releases, so no long-lived caching.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
